<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>삼국지 일기토</title>
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Hahmlet:wght@500;800&family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed 3D battlefield; foe plate pinned to the top edge and self plate to the bottom edge like scroll mounts; brush calligraphy bursts in the centre */
  --ink:#0e0b09;      /* 먹 */
  --paper:#eadfc8;    /* 한지 */
  --seal:#c8321e;     /* 인주 */
  --gold:#d2a850;     /* 금박 */
  --jade:#62b08d;     /* 옥 */
  --smoke:#9a9083;    /* 연기 */
  --f-brush:'Yuji Boku','Noto Serif KR','Noto Serif CJK KR','AppleMyungjo','Batang',serif;
  --f-hand:'East Sea Dokdo','Yuji Boku','Noto Serif KR','AppleMyungjo',cursive;
  --f-body:'Hahmlet','Noto Serif KR','Apple SD Gothic Neo','Malgun Gothic',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--f-body);background:var(--ink)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx,#vig,#hurt{pointer-events:none}
#vig,#hurt{position:absolute;inset:0;opacity:0}
#vig{background:radial-gradient(ellipse at center,transparent 42%,#7a0f06 130%)}
#hurt{background:radial-gradient(ellipse at center,#c8321e33 0%,#c8321ecc 100%)}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hj{font-family:var(--f-brush);font-weight:400}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.foe{position:absolute;left:0;right:0;top:0;padding:10px 16px 18px;display:flex;flex-direction:column;gap:5px;background:linear-gradient(#0e0b09d0,#0e0b0900)}
.foe-id{display:flex;align-items:baseline;gap:10px;padding-right:50px;white-space:nowrap}
.foe-id .hj{font-size:30px;line-height:1;text-shadow:0 2px 0 #000,0 0 14px #000}
.foe-id b{font-weight:800;font-size:15px}
.foe-id i{font-style:normal;font-weight:500;font-size:11px;color:var(--smoke);overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:11px;background:#0e0b09b0;outline:1px solid #eadfc83d;overflow:hidden;transform:skewX(-16deg)}
.bar i{position:absolute;inset:0;transform-origin:left center;will-change:transform}
.bar .lag{background:#f6e7c0}
#foeHp .fill{background:linear-gradient(#ea5236,#9e200d)}
#meHp .fill{background:linear-gradient(#86d6ae,#2c7a59)}
.bar.post{height:5px;outline:0;background:#0e0b0980}
.bar.post .fill{transform-origin:center;background:linear-gradient(90deg,#d2a850,#fff1bd,#d2a850)}
.bar.post.hot .fill{background:linear-gradient(90deg,#ff5a2a,#ffd9a0,#ff5a2a)}
.bar.st{height:5px;outline:0;background:#0e0b0980}
.bar.st .fill{background:var(--paper)}
.bar.st.low .fill{background:var(--seal)}
.round{position:absolute;left:16px;top:74px;font:400 22px/1 var(--f-brush);color:var(--paper);text-shadow:0 2px 0 #000,0 0 10px #000;letter-spacing:2px}
.pause{position:absolute;right:10px;top:8px;width:40px;height:40px;pointer-events:auto;font:800 15px var(--f-body);color:var(--paper);border:1px solid #eadfc84d;border-radius:50%;background:#0e0b0999}
.combo{position:absolute;right:14px;top:34%;text-align:right;opacity:0;transform-origin:right center;text-shadow:0 2px 0 #000,0 0 12px #000}
.combo b{display:block;font:800 44px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--gold)}
.combo span{font:400 18px var(--f-brush);letter-spacing:3px}
.hint{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);width:max-content;max-width:min(94%,600px);padding:6px 22px 8px;font:400 26px/1.15 var(--f-hand);word-break:keep-all;text-align:center;text-wrap:balance;color:var(--paper);background:linear-gradient(90deg,#0e0b0900,#0e0b09d9 14%,#0e0b09d9 86%,#0e0b0900);opacity:0;transition:opacity .25s}
.hint.on{opacity:1}
.me{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 14px;display:flex;align-items:flex-end;gap:12px;background:linear-gradient(#0e0b0900,#0e0b09e0)}
.me-id{font-size:27px;line-height:1;text-shadow:0 2px 0 #000,0 0 12px #000;padding-bottom:2px}
.me-bars{flex:1;display:flex;flex-direction:column;gap:5px;padding-bottom:6px;min-width:0}
.super{--ki:0;position:relative;flex:none;width:74px;height:74px;border-radius:50%;pointer-events:auto;background:conic-gradient(var(--gold) calc(var(--ki)*1%),#eadfc826 0);display:grid;place-items:center;transition:transform .12s}
.super::before{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2a211c,#0e0b09)}
.super .hj{position:relative;font-size:21px;line-height:1.02;writing-mode:vertical-rl;color:var(--smoke)}
.super.ready{box-shadow:0 0 0 3px var(--seal),0 0 30px #ff6a3d;animation:kiPulse .55s ease-in-out infinite alternate}
.super.ready::before{background:radial-gradient(circle at 50% 35%,#e2492f,#7d180a)}
.super.ready .hj{color:#fff3d6}
@keyframes kiPulse{from{transform:scale(1)}to{transform:scale(1.09)}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:22px 20px 18px;gap:14px}
#scrTitle{background:linear-gradient(#0e0b09bf 0%,#0e0b0926 34%,#0e0b0940 52%,#0e0b09f0 82%)}
.t-head{display:flex;gap:14px;align-items:flex-start}
.t-title{font:400 clamp(72px,24vw,132px)/.98 var(--f-brush);writing-mode:vertical-rl;margin:0;color:var(--paper);text-shadow:0 4px 0 #000,0 0 30px #000}
.t-side{display:flex;flex-direction:column;gap:10px;padding-top:10px;min-width:0}
.t-seal{width:46px;height:46px;background:var(--seal);color:#fff3d6;display:grid;place-items:center;font:400 17px/1.05 var(--f-brush);text-align:center;transform:rotate(-4deg);box-shadow:0 2px 0 #000}
.t-sub{font:400 40px/1 var(--f-hand);margin:0}
.t-tag{font-weight:500;font-size:13px;line-height:1.6;color:var(--paper);margin:0;max-width:22em;text-shadow:0 1px 0 #000}
.t-fill{flex:1;min-height:0}
.t-pick{display:flex;flex-direction:column;gap:10px}
.t-label{font-weight:800;font-size:12px;letter-spacing:2px;color:var(--gold);margin:4px 0 -4px}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero{pointer-events:auto;text-align:left;padding:10px 10px 11px;border:1px solid #eadfc840;background:#0e0b09b8;display:flex;flex-direction:column;gap:3px;min-width:0}
.hero .hj{font-size:30px;line-height:1.05}
.hero b{font-weight:800;font-size:14px}
.hero span{font-weight:500;font-size:11px;line-height:1.35;color:var(--smoke)}
.hero[aria-pressed="true"]{border-color:var(--seal);background:#c8321e2b;box-shadow:inset 0 -3px 0 var(--seal)}
.hero[aria-pressed="true"] span{color:var(--paper)}
.go{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;background:var(--seal);color:#fff3d6;box-shadow:0 3px 0 #5d1408}
.go .hj{font-size:32px;line-height:1}
.go b{font-weight:800;font-size:16px;letter-spacing:4px}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #5d1408}
.t-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:500;font-size:11px;color:var(--smoke)}
.kills-wrap{display:flex;align-items:center;gap:8px}
.kills{display:flex;gap:5px}
.kills i{font:400 17px/1 var(--f-brush);font-style:normal;width:26px;height:26px;display:grid;place-items:center;border:1px solid #eadfc833;color:#eadfc866}
.kills i.done{background:var(--seal);border-color:var(--seal);color:#fff3d6}
.ghost{pointer-events:auto;padding:7px 12px;border:1px solid #eadfc84d;font-weight:500;font-size:12px;color:var(--paper);background:#0e0b0999}
.how{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-weight:500;font-size:12px;line-height:1.5}
.how dt{color:var(--gold);font-weight:800}
.how dd{margin:0;color:var(--paper)}

#scrVs{justify-content:flex-end;padding-bottom:22%;background:linear-gradient(#0e0b0900 30%,#0e0b09e6 78%);pointer-events:auto}
.vs-stage{font-weight:800;font-size:13px;letter-spacing:3px;color:var(--gold);margin:0}
.vs-name{display:flex;align-items:baseline;gap:14px;margin:0}
.vs-name .hj{font-size:clamp(70px,22vw,120px);line-height:1;text-shadow:0 4px 0 #000,0 0 26px #000}
.vs-name b{font:400 40px/1 var(--f-hand)}
.vs-ttl{font-weight:500;font-size:13px;color:var(--smoke);margin:0}
.vs-quote{font:400 30px/1.2 var(--f-hand);margin:4px 0 0;max-width:16em;text-wrap:balance}
.vs-skip{font-weight:500;font-size:11px;color:var(--smoke);margin:0}

#scrResult,#scrPause{background:#0e0b09d9;justify-content:center;align-items:center;text-align:center;pointer-events:auto}
.r-big{font:400 clamp(110px,34vw,190px)/1 var(--f-brush);margin:0;color:var(--paper);text-shadow:0 5px 0 #000}
.r-big.win{color:#fff3d6;text-shadow:0 5px 0 #5d1408,0 0 60px #c8321e}
.r-line{font:400 34px/1.15 var(--f-hand);margin:0;text-wrap:balance}
.r-stats{display:grid;grid-template-columns:auto auto;gap:4px 22px;margin:6px 0;font-weight:500;font-size:14px;text-align:left}
.r-stats dt{color:var(--smoke)}
.r-stats dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.r-rank{display:flex;align-items:center;gap:10px;font-weight:500;font-size:12px;color:var(--smoke)}
.r-rank .hj{font-size:54px;line-height:1;color:var(--gold)}
.r-btns{display:flex;flex-direction:column;gap:10px;width:min(100%,320px);margin-top:8px}
.r-btns .go{width:100%}
.r-btns .ghost{padding:11px 12px;font-size:13px}
.p-title{font:400 54px/1 var(--f-hand);margin:0}

#fatal{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-weight:500;font-size:14px;line-height:1.7;background:var(--ink)}

@media (orientation:landscape) and (max-height:520px){
  .screen{padding:14px 22px 12px;gap:8px}
  #scrTitle{flex-flow:row wrap;align-content:space-between;background:linear-gradient(90deg,#0e0b09d9 0%,#0e0b0933 45%,#0e0b09e6 100%)}
  .t-head{flex:1 1 40%}
  .t-title{font-size:min(26vh,96px);writing-mode:horizontal-tb}
  .t-head{flex-direction:column;gap:2px}
  .t-side{padding-top:0;gap:4px}
  .t-seal{display:none}
  .t-sub{font-size:30px}
  .t-fill{display:none}
  .t-pick{flex:1 1 46%;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
  .t-foot{flex:1 1 100%}
  .how{display:none}
  .foe{padding-left:22%;padding-right:22%}
  .round{left:16px;top:14px}
  .hint{bottom:96px;font-size:24px}
  .me{padding-left:16%;padding-right:16%}
  #scrVs{padding-bottom:6%}
  .vs-name .hj{font-size:min(34vh,110px)}
  .r-big{font-size:min(34vh,150px)}
  .r-btns{flex-direction:row;width:min(100%,520px)}
}
@media (prefers-reduced-motion:reduce){.super.ready{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="vig"></div>
  <div id="hurt"></div>

  <div id="hud" class="hidden">
    <header class="foe">
      <div class="foe-id"><span class="hj" id="foeHj">華雄</span><b id="foeKr">화웅</b><i id="foeTtl">동탁군 효기교위</i></div>
      <div class="bar" id="foeHp"><i class="lag"></i><i class="fill"></i></div>
      <div class="bar post" id="foePost"><i class="fill"></i></div>
    </header>
    <div class="round" id="round">第一合</div>
    <button class="pause" id="btnPause" aria-label="일시정지">Ⅱ</button>
    <div class="combo" id="combo"><b id="comboN">0</b><span>連擊</span></div>
    <div class="hint" id="hint" role="status"></div>
    <footer class="me">
      <div class="me-id hj" id="meHj">關羽</div>
      <div class="me-bars">
        <div class="bar" id="meHp"><i class="lag"></i><i class="fill"></i></div>
        <div class="bar st" id="meSt"><i class="fill"></i></div>
      </div>
      <button class="super" id="btnSuper" aria-label="오의 발동"><span class="hj">奧義</span></button>
    </footer>
  </div>

  <section id="scrTitle" class="screen">
    <div class="t-head">
      <h1 class="t-title">一騎討</h1>
      <div class="t-side">
        <div class="t-seal">三<br>國</div>
        <p class="t-sub">삼국지 일기토</p>
        <p class="t-tag">말 위에서 맞붙는 단판 승부.<br>쳐내고, 무너뜨리고, 베어라.</p>
      </div>
    </div>
    <div class="t-fill"></div>
    <div class="t-pick">
      <dl class="how">
        <dt>스와이프</dt><dd>베기 · 빛나는 쪽으로 그으면 쳐내기</dd>
        <dt>길게 누르기</dt><dd>방어 (기력이 닳는다)</dd>
        <dt>奧義</dt><dd>기세가 차면 누르고 사방으로 베기</dd>
      </dl>
      <p class="t-label">출전 무장</p>
      <div class="heroes" id="heroes"></div>
      <button class="go" id="btnGo"><span class="hj">出陣</span><b>출진</b></button>
    </div>
    <div class="t-foot">
      <div class="kills-wrap"><span>격파</span><div class="kills" id="kills" aria-label="격파한 적장"></div><span>v0.1</span></div>
      <button class="ghost" id="btnSnd" aria-pressed="true">소리 켬</button>
    </div>
  </section>

  <section id="scrVs" class="screen hidden">
    <p class="vs-stage" id="vsStage">第一戰 · 사수관</p>
    <h2 class="vs-name"><span class="hj" id="vsHj">華雄</span><b id="vsKr">화웅</b></h2>
    <p class="vs-ttl" id="vsTtl">동탁군 효기교위</p>
    <p class="vs-quote" id="vsQuote"></p>
    <p class="vs-skip">화면을 누르면 바로 시작</p>
  </section>

  <section id="scrResult" class="screen hidden">
    <p class="r-big hj" id="rBig">勝</p>
    <p class="r-line" id="rLine"></p>
    <dl class="r-stats" id="rStats"></dl>
    <div class="r-rank" id="rRank"></div>
    <div class="r-btns">
      <button class="go" id="rNext"><b>다음 상대</b></button>
      <button class="ghost" id="rRetry">다시 겨루기</button>
      <button class="ghost" id="rHome">무장 선택으로</button>
    </div>
  </section>

  <section id="scrPause" class="screen hidden">
    <p class="p-title">잠시 멈춤</p>
    <div class="r-btns">
      <button class="go" id="pResume"><b>계속 싸우기</b></button>
      <button class="ghost" id="pSnd">소리 켬</button>
      <button class="ghost" id="pHome">무장 선택으로</button>
    </div>
  </section>

  <div id="fatal" class="hidden"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){var f=document.getElementById('fatal');f.textContent='3D 엔진(three.js)을 불러오지 못했습니다. 네트워크를 확인한 뒤 다시 열어 주세요.';f.classList.remove('hidden');return;}
// ───────────────────────── util ─────────────────────────
const T = THREE;
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const sat = (v) => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const rad = (d) => (d * PI) / 180;
const smooth = (t) => { t = sat(t); return t * t * (3 - 2 * t); };
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const EASE = {
  lin: (t) => t,
  in: (t) => t * t * t,
  in2: (t) => t * t,
  out: (t) => 1 - Math.pow(1 - t, 3),
  out2: (t) => 1 - (1 - t) * (1 - t),
  io: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
function mulberry(seed) {
  return function () {
    let t = (seed += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
class Spring {
  constructor(k = 120, c = 14) { this.x = 0; this.v = 0; this.k = k; this.c = c; }
  kick(v) { this.v += v; }
  update(dt) {
    const a = -this.k * this.x - this.c * this.v;
    this.v += a * dt; this.x += this.v * dt;
    return this.x;
  }
  reset() { this.x = 0; this.v = 0; }
}
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = (id) => document.getElementById(id);
const V3 = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);
const UP = V3(0, 1, 0);
const _a = V3(), _b = V3(), _c = V3(), _d = V3(), _e = V3();
const _m4 = new T.Matrix4(), _q = new T.Quaternion();

// material / mesh helpers (r128: Lambert is per-vertex, so flat look = non-indexed geometry)
const ALLMATS = [];
function mLam(color, o) { const m = new T.MeshLambertMaterial(Object.assign({ color }, o)); return m; }
function mPhong(color, spec = 0x444444, shin = 40, o) {
  return new T.MeshPhongMaterial(Object.assign({ color, specular: spec, shininess: shin, flatShading: true }, o));
}
function flat(g) { const n = g.index ? g.toNonIndexed() : g; n.computeVertexNormals(); return n; }
function mesh(g, m, x = 0, y = 0, z = 0, parent) {
  const o = new T.Mesh(g, m); o.position.set(x, y, z); if (parent) parent.add(o); return o;
}
function boxG(w, h, d) { return flat(new T.BoxGeometry(w, h, d)); }
function cylG(rt, rb, h, seg = 7) { return flat(new T.CylinderGeometry(rt, rb, h, seg)); }
// unit segment: base at origin, tip at +y(1). aimSeg stretches it between two points.
function segG(rBase, rTip, seg = 6) { const g = new T.CylinderGeometry(rTip, rBase, 1, seg); g.translate(0, 0.5, 0); return flat(g); }
function aimSeg(o, A, B) {
  o.position.copy(A);
  _e.subVectors(B, A); const len = _e.length() || 1e-4;
  o.quaternion.setFromUnitVectors(UP, _e.multiplyScalar(1 / len));
  o.scale.set(1, len, 1);
}
// two-bone IK. writes elbow, returns (possibly clamped) hand in `hand`
function solveIK(S, hand, l1, l2, pole, elbow) {
  _a.subVectors(hand, S); let L = _a.length();
  const maxL = (l1 + l2) * 0.995;
  if (L > maxL) { _a.multiplyScalar(maxL / L); L = maxL; hand.copy(S).add(_a); }
  if (L < 1e-4) L = 1e-4;
  const a = (l1 * l1 - l2 * l2 + L * L) / (2 * L);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  _b.copy(_a).multiplyScalar(1 / L);
  _c.copy(pole).addScaledVector(_b, -pole.dot(_b));
  if (_c.lengthSq() < 1e-6) _c.set(0, -1, 0).addScaledVector(_b, _b.y);
  _c.normalize();
  elbow.copy(S).addScaledVector(_b, a).addScaledVector(_c, h);
}
// orient object so local +y -> dir and local +x -> edge (projected)
const _X = V3(), _Y = V3(), _Z = V3();

    const on = Snd.isOn();
    $('btnSnd').textContent = on ? '소리 켬' : '소리 끔'; $('btnSnd').setAttribute('aria-pressed', String(on));
    $('pSnd').textContent = on ? '소리 켬' : '소리 끔';
  }
  function toggleSnd() { Snd.init(); Snd.resume(); Snd.setOn(!Snd.isOn()); Save.d.snd = Snd.isOn(); Save.save(); syncSnd(); Snd.ui(); }
  function buildTitle() {
    const wrap = $('heroes'); wrap.innerHTML = '';
    HEROES.forEach((h) => {
      const b = document.createElement('button'); b.className = 'hero'; b.type = 'button';
      b.setAttribute('aria-pressed', String(h === G.hero));
      b.innerHTML = '<span class="hj">' + h.hj + '</span><b>' + h.kr + '</b><span>' + h.wname + '<br>' + h.trait + '</span>';
      b.addEventListener('click', () => {
        G.hero = h; Snd.init(); Snd.resume(); Snd.ui();
        Array.prototype.forEach.call(wrap.children, (c, i) => c.setAttribute('aria-pressed', String(HEROES[i] === h)));
      });
      wrap.appendChild(b);
    });
    const kills = $('kills'); kills.innerHTML = '';
    G.startIdx = Save.d.cleared >= STAGES.length ? 0 : Save.d.cleared;
    STAGES.forEach((s, i) => {
      const b = document.createElement('i'); b.textContent = s.hj[0]; b.title = s.kr;
      if (i < Save.d.cleared) b.className = 'done';
      kills.appendChild(b);
    });
    syncSnd();
  }
  function showVs(stage, idx) {
    $('vsStage').textContent = '第' + hjNum(idx + 1) + '戰 · ' + stage.placeKr + ' ' + stage.place;
    $('vsHj').textContent = stage.hj; $('vsKr').textContent = stage.kr; $('vsTtl').textContent = stage.ttl;
    $('vsQuote').textContent = '“' + stage.quote + '”';
    show('vs');
  }
  function fmtTime(s) { const m = (s / 60) | 0, r = Math.round(s - m * 60); return m + ':' + (r < 10 ? '0' : '') + r; }
  function showResult(win) {
    const s = G.stats, st = G.stage, last = G.stageIdx >= STAGES.length - 1, big = $('rBig');
    hud(false); hint('', 0);
    big.textContent = win ? (last ? '無雙' : '勝') : '敗';
    big.classList.toggle('win', win);
    big.style.fontSize = win && last ? 'clamp(84px,26vw,150px)' : '';
    $('rLine').textContent = win
      ? (last ? '천하무쌍! 다섯 적장을 모두 꺾었다' : '적장 ' + st.kr + josa(st.kr, '을', '를') + ' 쓰러뜨렸다')
      : st.kr + '의 ' + ({ glaive: '대도', spear: '창', halberd: '방천화극', serpent: '사모' }[st.weapon]) + '에 당했다';
    const rows = [['겨룬 합', G.round + '합'], ['걸린 시간', fmtTime(s.time)], ['완벽한 쳐내기', s.perfect + '회'], ['최대 연격', s.maxCombo + '연격'], ['받은 피해', String(Math.round(s.taken))]];
    $('rStats').innerHTML = rows.map((r) => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join('');
    const rank = $('rRank');
    if (win) {
      const score = 100 - (s.taken / G.p.hpMax) * 60 - Math.max(0, s.time - 70) * 0.2 + s.perfect * 2.2;
      const r = score >= 96 ? ['神', '신기에 가까운 솜씨'] : score >= 76 ? ['甲', '빼어난 승리'] : score >= 52 ? ['乙', '무난한 승리'] : ['丙', '가까스로 이겼다'];
      rank.innerHTML = '<span class="hj">' + r[0] + '</span><span>' + r[1] + '</span>';
    } else rank.innerHTML = G.retries < 3 ? '<span>다시 맞서면 체력이 15% 늘고, 적의 공격이 조금 더 잘 보인다</span>' : '<span>이미 기세는 오를 만큼 올랐다. 이번에는 벤다</span>';
    const next = $('rNext');
    next.classList.toggle('hidden', !win || last);
    if (win && !last) { const n = STAGES[G.stageIdx + 1]; next.innerHTML = '<b>다음 상대</b><span class="hj">' + n.hj + '</span>'; }
    $('rRetry').textContent = win ? '다시 겨루기' : '재도전';
    $('rRetry').className = win ? 'ghost' : 'go';
    if (!win) $('rRetry').innerHTML = '<b>재도전</b>';
    show('result');
  }
  $('btnGo').addEventListener('click', () => Game.startRun());
  $('btnSnd').addEventListener('click', toggleSnd);
  $('pSnd').addEventListener('click', toggleSnd);
  $('btnPause').addEventListener('click', () => Game.pause(true));
  $('pResume').addEventListener('click', () => Game.pause(false));
  $('pHome').addEventListener('click', () => { Snd.resume(); Game.toTitle(); });
  $('rNext').addEventListener('click', () => { Snd.ui(); Game.next(); });
  $('rRetry').addEventListener('click', () => { Snd.ui(); Game.retry(!!(G.p && G.p.dead)); });
  $('rHome').addEventListener('click', () => { Snd.ui(); Game.toTitle(); });
  scr.vs.addEventListener('pointerdown', () => Game.tap());
  btnSuper.addEventListener('pointerdown', (e) => { e.preventDefault(); Game.special(); });
  return { show, hud, setFoe, setHero, setRound, hint, hurt, frame, buildTitle, showVs, showResult, syncSnd };
})();

// ───────────────────────── camera, loop, boot ─────────────────────────
const Cam = (() => {
  const cam = new T.PerspectiveCamera(70, 1, 0.04, 1500);
  cam.rotation.order = 'YXZ';
  let trauma = 0, baseFov = 70, W = 1, H = 1, aspect = 1, zoomK = 0, chargeK = 0, headBob = 0;
  const sp = { pitch: new Spring(150, 15), yaw: new Spring(150, 15), roll: new Spring(120, 12), z: new Spring(170, 17), fov: new Spring(120, 13) };
  const P = V3(), Epos = V3(), invQ = new T.Quaternion(), _p = V3(), scr = { x: 0, y: 0 };
  function resize(w, h) {
    W = w; H = h; aspect = w / h;
    baseFov = clamp((2 * Math.atan(Math.tan(rad(31)) / aspect) * 180) / PI, 52, 74);
    cam.aspect = aspect; cam.fov = baseFov; cam.updateProjectionMatrix();
  }
  function shake(v) { v *= REDUCED ? 0.35 : 1; trauma = Math.min(1.25, Math.max(trauma, v)); }
  function punch(v) { sp.fov.kick(v * 20); }
  function hitKick(dir, k) {
    if (dir === 'L') { sp.roll.kick(-2.4 * k); sp.yaw.kick(-1.8 * k); }
    else if (dir === 'R') { sp.roll.kick(2.4 * k); sp.yaw.kick(1.8 * k); }
    else if (dir === 'U') sp.pitch.kick(-2.6 * k);
    else sp.pitch.kick(1.8 * k);
    sp.z.kick(3.6 * k);
  }
  function swingKick(dir) {
    const v = { L: [0.55, 0], R: [-0.55, 0], U: [0, 0.45], D: [0, -0.45] }[dir];
    sp.yaw.kick(v[0]); sp.pitch.kick(v[1]); sp.roll.kick(v[0] * 0.7);
  }
  function update(dt, rdt, t) {
    trauma = Math.max(0, trauma - rdt * 1.9);
    const tr = trauma * trauma, tt = G.rt;
    const nz = (a, b) => Math.sin(tt * a + b) * 0.6 + Math.sin(tt * a * 1.83 + b * 2.1) * 0.4;
    const shY = nz(41, 0.3) * tr * 0.05, shP = nz(47, 1.7) * tr * 0.042, shR = nz(37, 4.1) * tr * 0.07;
    const kP = sp.pitch.update(rdt) * 0.3, kY = sp.yaw.update(rdt) * 0.3, kR = sp.roll.update(rdt) * 0.3, kZ = sp.z.update(rdt) * 0.55, kF = sp.fov.update(rdt);
    const s = Math.sin(G.theta), c = Math.cos(G.theta);
    let fov = baseFov;
    if (G.mode === 'title') {
      Epos.set(0, 0, 0); P.set(s * 6.4, 0, c * 6.4);
      const port = aspect < 1, dc = G.dbg;
      cam.position.set(P.x, 2.05, P.z);
      cam.rotation.set(port ? -0.02 : 0.03, G.theta + (port ? 0 : -0.26), 0);
      fov = port ? 46 : 34;
      if (dc) { cam.position.set(s * dc.r, dc.y, c * dc.r); cam.rotation.set(dc.pitch, G.theta, 0); fov = dc.fov; }
      headBob = 0;
    } else {
      const hd = G.d / 2, dEff = Math.max(1.6, G.d + G.lunge.x + G.push.x);
      P.set(s * hd, 0, c * hd); Epos.set(s * (hd - dEff), 0, c * (hd - dEff));
      const scale = Rig.E ? Rig.E.scale : 1, ph = G.pPhase * TAU;
      headBob = G.pGait * 0.085 * Math.sin(ph - 0.6) + (1 - G.pGait) * 0.012 * Math.sin(t * 2.1);
      let eyeY = EYE_H + headBob + G.pRear * 0.28;
      let pitch = -Math.atan2(EYE_H - 2.2 * scale, Math.max(2.2, dEff)) * sat(8 / dEff) + G.pGait * 0.012 * Math.sin(ph + 0.9) + G.pRear * 0.26;
      let roll = G.pGait * 0.014 * Math.sin(ph * 0.5) + clamp(G.omega, -1.2, 1.2) * 0.05 + (1 - G.pGait) * 0.006 * Math.sin(t * 0.83);
      pitch += (1 - G.pGait) * 0.004 * Math.sin(t * 1.13 + 1);
      if (G.camFall > 0) { const k = EASE.in2(G.camFall); eyeY = lerp(eyeY, 0.5, k); roll += k * 1.2; pitch += k * 0.3; }
      cam.position.set(P.x + s * kZ, eyeY, P.z + c * kZ);
      let yaw = G.theta;
      if (G.mode === 'victory' && Rig.fallen(_p)) { // follow the fallen general
        const k = smooth(G.endT / 0.9), dx = _p.x - cam.position.x, dz = _p.z - cam.position.z;
        let dyaw = Math.atan2(-dx, -dz) - yaw; dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
        yaw += dyaw * k * 0.85;
        pitch = lerp(pitch, Math.atan2(_p.y + 0.3 - eyeY, Math.hypot(dx, dz)), k * 0.8);
      }
      cam.rotation.set(pitch + kP + shP, yaw + kY + shY, roll + kR + shR);
      zoomK = damp(zoomK, G.mode === 'intro' ? 1 : 0, G.mode === 'intro' ? 3 : 5, rdt);
      // charge: dolly-zoom — long lens while the foe is far, widening as the gap closes
      const far = G.mode === 'charge' ? smooth((dEff - 5) / 34) : 0;
      chargeK = damp(chargeK, far, 6, rdt);
      fov = lerp(lerp(baseFov + G.pGait * 8, 40, chargeK) - (1 - G.focus) * 16 + (G.p && G.p.guard ? -3 : 0), 23, zoomK);
    }
    fov = clamp(fov + kF, 12, 100);
    if (Math.abs(fov - cam.fov) > 0.01) { cam.fov = fov; cam.updateProjectionMatrix(); }
    cam.updateMatrixWorld(true);
    invQ.copy(cam.quaternion).invert();
  }
  function front(out, dist, side, up) {
    out.set(side || 0, up || 0, -dist).applyQuaternion(cam.quaternion).add(cam.position);
    return out;
  }
  function project(v) { _p.copy(v).project(cam); scr.x = (_p.x + 1) * 0.5 * W; scr.y = (1 - _p.y) * 0.5 * H; return scr; }
  const right = (out) => out.set(1, 0, 0).applyQuaternion(cam.quaternion);
  const fwd = (out) => out.set(0, 0, -1).applyQuaternion(cam.quaternion);
  return { cam, P, Epos, invQ, resize, shake, punch, hitKick, swingKick, update, front, project, right, fwd,
    get baseFov() { return baseFov; }, get aspect() { return aspect; }, get headBob() { return headBob; } };
})();

const Main = (() => {
  let renderer, PR = 1, last = 0, fAcc = 0, fN = 0, lastP = 0, lastE = 0, windV = -1, stepT = 0, tossT = 3, ok = false;
  const _f = V3(), rigS = { pos: Cam.Epos, yaw: 0, psi: 0, phase: 0, gait: 0, rear: 0, toss: 0, wind: 0, low: 0 };
  const vmS = { aspect: 1, pitch: 0, roll: 0, psi: 0, phase: 0, gait: 0, rear: 0, toss: 0, headBob: 0, invQ: Cam.invQ };
  const BEATS = [0, 0.12, 0.5, 0.62];
  function resize() {
    const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(PR); renderer.setSize(w, h, false);
    Cam.resize(w, h);
    VM.cam.aspect = w / h; VM.cam.fov = Cam.baseFov; VM.cam.updateProjectionMatrix();
    F2.resize(w, h);
    if (ok && G.paused) tick(0.0001); // keep the frozen frame matched to the new size
  }
  function hooves(dt) {
    const pv = G.pGait, ev = G.eGait;
    if (pv > 0.25) for (let i = 0; i < 4; i++) if (Math.floor(G.pPhase - BEATS[i]) !== Math.floor(lastP - BEATS[i])) Snd.hoof(0.7 * pv, 1);
    if (ev > 0.25 && G.mode !== 'title') {
      const near = sat(1 - G.d / 60);
      for (let i = 0; i < 4; i++) if (Math.floor(G.ePhase - BEATS[i]) !== Math.floor(lastE - BEATS[i])) {
        Snd.hoof(0.45 * ev * near, 1.25);
        if (i % 2 === 0) FX.dustBurst(Cam.Epos, 3, 0.5, 1, 0.9);
      }
    }
    lastP = G.pPhase; lastE = G.ePhase;
    if (G.mode === 'melee' || G.mode === 'super') {
      stepT -= dt;
      if (stepT <= 0) { stepT = rnd(0.35, 0.9); Snd.hoof(0.22, 0.9); FX.dustBurst(Math.random() < 0.6 ? Cam.Epos : Cam.P, 2, 0.6, 0.7, 0.7); }
    }
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const rdt = clamp((now - last) / 1000, 0.001, 0.05); last = now;
    if (!ok || G.paused || G.mode === 'boot' || G.manual) return;
    tick(rdt);
  }
  function tick(rdt) {
    G.rt += rdt;
    if (G.slowT > 0) { G.slowT -= rdt; G.timeScale = G.slowTo; } else G.timeScale = damp(G.timeScale, 1, 7, rdt);
    let dt = rdt * G.timeScale * G.focus;
    if (G.hitStop > 0) { G.hitStop -= rdt; dt = 0; }
    if (G.freeze) dt = 0;
    G.t += dt;
    Game.update(dt, rdt);
    Cam.update(dt, rdt, G.t);
    hooves(dt);
    const title = G.mode === 'title';
    const speedK = G.mode === 'charge' ? sat(G.cV / 21) * G.pGait : 0;
    tossT -= dt; if (tossT <= 0) { tossT = rnd(2.5, 6); if (G.mode === 'melee') G.eToss = Math.max(G.eToss, 0.8); }
    rigS.toss = G.eToss;
    rigS.yaw = title ? 0.5 : G.theta; rigS.psi = title ? 0 : G.psi * 1.45; rigS.low = title ? 0 : sat(G.psi / PSI) * (1 - G.eRear); rigS.phase = G.ePhase; rigS.gait = G.eGait; rigS.rear = G.eRear;
    rigS.wind = title ? 0.22 : clamp(speedK * 0.9 + Math.abs(G.lunge.v) * 0.12 + 0.06, 0, 1);
    Rig.update(dt, rdt, G.t, rigS);
    Cam.fwd(_f);
    if (G.needMotes) { G.needMotes = false; World.seedMotes(Cam.cam.position); }
    World.update(dt, G.t, Cam.cam.position, _f);
    FX.update(dt);
    uPScale.value = (renderer.domElement.height) / (2 * Math.tan(rad(Cam.cam.fov) / 2));
    const draw3d = !G.noRender;
    if (draw3d) { renderer.clear(); renderer.render(World.scene, Cam.cam); }
    if (!title) {
      vmS.aspect = Cam.aspect; vmS.pitch = Cam.cam.rotation.x; vmS.roll = Cam.cam.rotation.z; vmS.psi = G.psi * clamp(Cam.aspect * 0.8, 0.36, 1);
      vmS.phase = G.pPhase; vmS.gait = G.pGait; vmS.rear = G.pRear; vmS.headBob = Cam.headBob * 0.35;
      VM.update(dt, G.t, vmS);
      if (draw3d) { renderer.clearDepth(); renderer.render(VM.scene, VM.cam); }
    }
    // 2D layer
    let ind = null; const e = G.e;
    if (e && e.atk && !e.atk.resolved && !e.atk.parry && e.state === 'windup' && (G.mode === 'melee' || G.mode === 'charge')) {
      const a = e.atk, real = !a.feint || a.feinted;
      ind = { dir: a.dir, remain: Math.max(0, (real ? a.tHit : a.fakeHit) - G.t), wind: real && a.feint ? a.wind2 : a.wind, heavy: a.heavy, pw: (a.charge ? 0.19 : 0.14) * G.hero.parry, tut: G.freeze };
    }
    F2.setSpeed(speedK);
    F2.draw(rdt, ind);
    UI.frame(rdt);
    const wv = Math.round(speedK * 12);
    if (wv !== windV) { windV = wv; Snd.setWind(wv / 12); }
    Snd.update(e ? (e.enraged ? 1 : (1 - e.hp / e.hpMax) * 0.7) : 0);
    // adaptive resolution
    fAcc += rdt; fN++;
    if (fN >= 100) { const avg = fAcc / fN; fAcc = 0; fN = 0; if (avg > 0.027 && PR > 1) { PR = Math.max(1, PR - 0.25); resize(); } }
  }
  function fatal(msg) { const f = $('fatal'); f.textContent = msg; f.classList.remove('hidden'); }
  function boot(data) {
    try {
      renderer = new T.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' });
    } catch (err) { return fatal('이 기기에서는 3D 화면(WebGL)을 열 수 없습니다. 다른 브라우저로 다시 열어 주세요.'); }
    renderer.autoClear = false;
    PR = Math.min(window.devicePixelRatio || 1, 2);
    Save.load();
    G.hero = HEROES.find((h) => h.id === Save.d.hero) || HEROES[0];
    Snd.setOn(Save.d.snd !== false);
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 120));
    document.addEventListener('visibilitychange', () => { if (document.hidden && (G.mode === 'melee' || G.mode === 'charge' || G.mode === 'super' || G.mode === 'transition' || G.mode === 'intro')) Game.pause(true); });
    window.addEventListener('pointerdown', () => { if (!G.paused) { Snd.init(); Snd.resume(); } }, { passive: true });
    Input.bind({ swipe: Game.swipe, guard: Game.guard, tap: Game.tap, special: Game.special, pause: () => Game.pause() });
    VM.setHero(G.hero);
    Game.toTitle();
    if (data && data.inRun && typeof data.stage === 'number') {
      const h = HEROES.find((x) => x.id === data.hero); if (h) G.hero = h;
      G.startIdx = clamp(data.stage | 0, 0, STAGES.length - 1); Game.startRun();
    }
    ok = true; last = performance.now();
    requestAnimationFrame(frame);
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('400 40px "Yuji Boku"', '一騎討合斬破崩危討彈裂怒第落馬董袁曹呂劉'), document.fonts.load('400 30px "East Sea Dokdo"', '완벽한 쳐내기')])
        .then(() => { World.setArmy('foe', ARMY[G.stage.army]); World.setArmy('ally', ARMY.ally); }).catch(() => {});
    }
  }
  function info() {
    renderer.info.autoReset = false; renderer.info.reset(); tick(0.016);
    const r = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, points: renderer.info.render.points, geo: renderer.info.memory.geometries, tex: renderer.info.memory.textures, pr: PR };
    renderer.info.autoReset = true; return r;
  }
  return { boot, resize, tick, info };
})();
window.__ilgito = { G, Game, Rig, Cam, VM, Snd, Save, F2, UI, World, EP, VP, STAGES, PALS, ARMY, HEROES, step(dt, n) { for (let i = 0; i < (n || 1); i++) Main.tick(dt); }, info: () => Main.info() };
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ hero: G.hero.id, stage: G.stageIdx, inRun: G.mode !== 'title' && G.mode !== 'boot' })); } catch (e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(Main.boot);
else Main.boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();
</script>
